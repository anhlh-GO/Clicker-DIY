plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'com.anhlhgo.clickerdiy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anhlhgo.clickerdiy'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "0.6.${vc}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly (sideload)
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
