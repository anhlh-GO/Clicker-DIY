plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anhlhgo.clickerdiy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anhlhgo.clickerdiy'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE') ?: '1') as int
        versionName '0.6.' + (System.getenv('VERSION_CODE') ?: '1')
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly (sideload)
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // keep webp/mp3/json assets uncompressed-friendly and include dot files
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
