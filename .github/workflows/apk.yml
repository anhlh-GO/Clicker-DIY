name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle the web build into the app
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp -r index.html icon.png js data assets vendor "$W/"
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Clicker-DIY.apk && ls -la Clicker-DIY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clicker-DIY-apk
          path: Clicker-DIY.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clicker DIY (latest build)
          body: |
            Android build of the HTML5 port, commit ${{ github.sha }} (build ${{ github.run_number }}).
            Download Clicker-DIY.apk and install it (allow installing from unknown sources).
          files: Clicker-DIY.apk
          make_latest: true
          prerelease: false
